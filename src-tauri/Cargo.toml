[package]
name = "mac-to-windows"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies]
event-model = { path = "../crates/event-model" }
rule-engine = { path = "../crates/rule-engine" }
diagnostics = { path = "../crates/diagnostics" }
macos-adapter = { path = "../crates/macos-adapter" }
clipboard-core = { path = "../crates/clipboard-core" }
mac-to-windows-config = { path = "../crates/config" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

