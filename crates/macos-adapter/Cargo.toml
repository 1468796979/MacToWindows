[package]
name = "macos-adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
diagnostics = { path = "../diagnostics" }
event-model = { path = "../event-model" }
dispatch2 = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEventTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

