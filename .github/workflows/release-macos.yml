name: Release macOS arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.2"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        default: "MacToWindows macOS arm64"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install arm64 target and Tauri CLI
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          npm install --global @tauri-apps/cli@2.12.4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/mactowindows-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          python3 - <<'PY' > "$CERTIFICATE_PATH"
          import base64
          import os
          import sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64"]))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
            | head -n 1)"
          test -n "$IDENTITY"
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import App Store Connect API key
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/AuthKey.p8"
          import base64
          import os
          import sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))
          PY
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: Build unsigned arm64 app bundle
        run: |
          set -euo pipefail
          tauri build --target aarch64-apple-darwin --bundles app --no-sign --ci

      - name: Sign app bundle
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          codesign --force --deep --options runtime --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/MacToWindows-arm64.zip"

      - name: Notarize and staple app archive
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/MacToWindows-arm64.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          xcrun stapler validate "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"

      - name: Create, sign, notarize and staple DMG
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          DMG_PATH="$RUNNER_TEMP/MacToWindows-arm64.dmg"
          hdiutil create -volname MacToWindows \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          shasum -a 256 "$DMG_PATH" "$RUNNER_TEMP/MacToWindows-arm64.zip" > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## MacToWindows ${RELEASE_TAG}

          - Apple Silicon (arm64) macOS build
          - Developer ID signed and Apple notarized
          - SHA-256 checksums are included in SHA256SUMS.txt
          EOF
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/MacToWindows-arm64.dmg" \
            "$RUNNER_TEMP/MacToWindows-arm64.zip" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --title "$RELEASE_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
