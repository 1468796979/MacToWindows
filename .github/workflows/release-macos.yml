name: Release macOS arm64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v0.1.2"
        required: true
        type: string
      release_name:
        description: "Release title"
        required: false
        default: "MacToWindows macOS arm64"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release version and source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          python3 - <<'PY_VERSION'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          cargo = Path("src-tauri/Cargo.toml").read_text()
          package = re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", cargo)
          cargo_version = re.search(r'^version\s*=\s*"([^"\n]+)"\s*$', package.group(1), re.M) if package else None
          if not cargo_version or cargo_version.group(1) != version:
              raise SystemExit("Tauri and Cargo package versions must match")
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag must equal v + the Tauri/Cargo version")
          PY_VERSION
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SOURCE_SHA"
          fi

      - name: Check signing and notarization secrets
        run: |
          python3 - <<'PY_SECRETS'
          import os
          required = [
              "DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64",
              "DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD",
              "APPLE_API_KEY_BASE64", "APPLE_API_KEY_ID", "APPLE_API_ISSUER_ID",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing release secrets: " + ", ".join(missing))
          PY_SECRETS

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install arm64 target and Tauri CLI
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          npm install --global @tauri-apps/cli@2.12.4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/mactowindows-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          python3 - <<'PY' > "$CERTIFICATE_PATH"
          import base64
          import os
          import sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64"]))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
            | head -n 1)"
          test -n "$IDENTITY"
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import App Store Connect API key
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/AuthKey.p8"
          import base64
          import os
          import sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))
          PY
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: Build unsigned arm64 app bundle
        run: |
          set -euo pipefail
          tauri build --target aarch64-apple-darwin --bundles app --no-sign --ci

      - name: Sign app bundle
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/mac-to-windows")" = arm64
          codesign --force --deep --options runtime --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/MacToWindows-arm64.zip"

      - name: Notarize and staple app archive
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/MacToWindows-arm64.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/app-notarization.json"
          python3 - "$RUNNER_TEMP/app-notarization.json" <<'PY_NOTARY'
          import json
          import sys
          status = json.load(open(sys.argv[1]))["status"]
          if status != "Accepted":
              raise SystemExit("App notarization was not accepted: " + status)
          PY_NOTARY
          xcrun stapler staple "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          xcrun stapler validate "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app" \
            "$RUNNER_TEMP/MacToWindows-arm64.zip"

      - name: Create, sign, notarize and staple DMG
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle/macos/MacToWindows.app"
          DMG_PATH="$RUNNER_TEMP/MacToWindows-arm64.dmg"
          STAGE_PATH="$(mktemp -d "$RUNNER_TEMP/mactowindows-dmg-stage.XXXXXX")"
          ditto "$APP_PATH" "$STAGE_PATH/MacToWindows.app"
          ln -s /Applications "$STAGE_PATH/Applications"
          hdiutil create -volname MacToWindows -fs HFS+ \
            -srcfolder "$STAGE_PATH" \
            -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          python3 - "$RUNNER_TEMP/dmg-notarization.json" <<'PY_NOTARY'
          import json
          import sys
          status = json.load(open(sys.argv[1]))["status"]
          if status != "Accepted":
              raise SystemExit("DMG notarization was not accepted: " + status)
          PY_NOTARY
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          MOUNT_PATH="$(mktemp -d "$RUNNER_TEMP/mactowindows-dmg-check.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_PATH" "$DMG_PATH" > /dev/null
          trap 'hdiutil detach "$MOUNT_PATH" > /dev/null' EXIT
          test -d "$MOUNT_PATH/MacToWindows.app/Contents"
          test ! -d "$MOUNT_PATH/Contents"
          test "$(readlink "$MOUNT_PATH/Applications")" = /Applications
          test "$(lipo -archs "$MOUNT_PATH/MacToWindows.app/Contents/MacOS/mac-to-windows")" = arm64
          codesign --verify --deep --strict --verbose=2 "$MOUNT_PATH/MacToWindows.app"
          xcrun stapler validate "$MOUNT_PATH/MacToWindows.app"
          spctl --assess --type execute --verbose=4 "$MOUNT_PATH/MacToWindows.app"
          hdiutil detach "$MOUNT_PATH" > /dev/null
          trap - EXIT
          rmdir "$MOUNT_PATH"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 MacToWindows-arm64.dmg MacToWindows-arm64.zip > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          # Recheck tags after the build; never publish against a different commit.
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SOURCE_SHA"
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## MacToWindows ${RELEASE_TAG}

          - Apple Silicon (arm64) macOS build
          - Source commit: ${RELEASE_SOURCE_SHA}
          - Developer ID signed and Apple notarized
          - SHA-256 checksums are included in SHA256SUMS.txt
          EOF
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/MacToWindows-arm64.dmg" \
            "$RUNNER_TEMP/MacToWindows-arm64.zip" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
