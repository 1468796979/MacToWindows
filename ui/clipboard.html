<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剪贴板历史</title>
    <link rel="stylesheet" href="./clipboard.css" />
  </head>
  <body>
    <main id="clipboard-panel" class="clipboard-panel" aria-labelledby="clipboard-title">
      <header id="clipboard-drag-region" class="clipboard-header">
        <div>
          <p class="eyebrow">MacToWindows</p>
          <h1 id="clipboard-title">剪贴板历史</h1>
        </div>
        <button id="clipboard-close" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>
      <p id="clipboard-error" class="clipboard-error" aria-live="polite"></p>
      <section id="clipboard-list" class="clipboard-list" role="listbox" aria-label="剪贴板历史"></section>
      <p id="clipboard-empty" class="clipboard-empty">还没有剪贴板记录。</p>
      <footer class="clipboard-footer">
        <span>选择后恢复原应用并自动粘贴</span>
        <button id="clipboard-clear" class="text-button" type="button">清空历史</button>
      </footer>
    </main>
    <script src="./clipboard-core.js"></script>
    <script src="./clipboard.js"></script>
  </body>
</html>
